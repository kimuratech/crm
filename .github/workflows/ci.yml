name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js (for frontend build)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build frontend
        working-directory: ./frontend
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build
          else
            echo "No frontend/package.json found — skipping frontend build"
          fi

      - name: Copy frontend build into backend static dir
        run: |
          if [ -d frontend/build ]; then
            mkdir -p static
            rm -rf static/* || true
            cp -R frontend/build/* static/
            echo "Copied frontend/build -> static/"
          else
            echo "No frontend/build found — skipping copy"
          fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations & checks
        run: |
          python manage.py migrate --noinput
          python manage.py check

      - name: Run tests
        run: |
          python manage.py test --verbosity=2
