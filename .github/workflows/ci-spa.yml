name: CI — Backend tests & SPA build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services: {}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: |
          python manage.py migrate --noinput

      - name: Run backend tests (pytest)
        run: |
          pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies (if present)
        working-directory: frontend
        run: |
          if [ -f package-lock.json ] || [ -f package.json ]; then npm ci; else echo "No frontend package.json found, skipping"; fi

      - name: Build frontend (mock/optional)
        working-directory: frontend
        run: |
          if [ -f package.json ]; then npm run build --if-present; else echo "No frontend to build"; fi

      - name: Verify build artifact
        run: |
          if [ -f frontend/build/index.html ]; then echo "frontend build exists"; else echo "frontend build not found (ok for projects without SPA)"; fi
